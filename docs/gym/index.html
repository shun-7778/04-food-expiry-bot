<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- URL にトークンが入っているので、外部へ出す通信に Referer として付けさせない -->
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<title>Let's Go Mt.Fuji！！</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  p { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      color: #555; padding: 24px; font-size: 15px; }
</style>
</head>
<body>
<script>
// ジムスタンプラリーの画面（Google Apps Script）を、そのまま枠として表示するだけのページ。
// Apps Script を直接開くと Google の注意バーが上に出るので、それを避けるために挟んでいる。
// 仕組みは ../index.html（食材管理）と同じ。
//
// 表示先とトークンは URL のパラメータで受け取る（このページ自体には何も持たせない）:
//   ?u=<Apps Script の /exec URL を encodeURIComponent したもの>&k=<トークン>&tab=<stamp|coin>
(function () {
  var q = new URLSearchParams(location.search);
  var url = q.get('u') || '';
  var key = q.get('k') || '';
  // 知らない値を素通しせず、決め打ちの2つだけを中へ渡す
  var tab = q.get('tab') === 'coin' ? 'coin' : 'stamp';

  // 差し込み先は Apps Script の URL に限る（別のサイトを埋め込まされないように）
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url) || !key) {
    document.write('<p>リンクが正しくありません。LINE のメニューから開き直してください。</p>');
    return;
  }

  var frame = document.createElement('iframe');
  frame.src = url + '?k=' + encodeURIComponent(key) + '&tab=' + tab;
  document.body.appendChild(frame);
})();
</script>
</body>
</html>
