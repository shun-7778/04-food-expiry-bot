<!DOCTYPE html>
<!-- リッチメニューの画像の元（2500×1200）。richmenu.mjs が Edge で撮って richmenu.png と RichMenuImage.gs を作る -->
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
  html, body { margin: 0; width: 2500px; height: 1200px; overflow: hidden; background: #FFFFFF; }
  .menu { display: grid; grid-template-columns: 1250px 1250px; height: 1200px; }
  .cell { position: relative; display: grid; align-content: center; justify-items: center; gap: 40px; }
  .cell + .cell { border-left: 8px solid #E2E9EF; }
  .cell svg { width: 480px; height: 480px; }
  .t { font-family: "Dela Gothic One", sans-serif; font-size: 160px; line-height: 1; }
  .s { font-family: "Zen Maru Gothic", sans-serif; font-weight: 900; font-size: 80px; color: #6B7A86; }
  .main { background: linear-gradient(180deg, #FFEBDD 0%, #E8F2FC 100%); }
  .main .t { color: #0B7F74; }
  .coin .t { color: #C47F00; }
</style>
</head>
<body>
<div class="menu">
  <div class="cell main">
    <svg viewBox="0 0 100 100">
      <path d="M6 86 L40 34 Q50 22 60 34 L94 86 Z" fill="#5E8FD0"/>
      <path d="M40 34 Q50 22 60 34 L68 46 L60 43 L55 51 L50 44 L45 51 L40 43 L32 46 Z" fill="#FFFFFF"/>
      <circle cx="78" cy="22" r="14" fill="#12A99B"/>
      <path d="M71 22 L76 27 L86 16" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="t">スタンプラリー</div>
    <div class="s">スタンプを押す</div>
  </div>
  <div class="cell coin">
    <svg viewBox="0 0 100 100">
      <defs><radialGradient id="cf" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#FFE68A"/><stop offset=".55" stop-color="#F5B300"/><stop offset="1" stop-color="#D99100"/></radialGradient></defs>
      <circle cx="50" cy="54" r="40" fill="#C47F00"/>
      <circle cx="50" cy="50" r="40" fill="url(#cf)" stroke="#C47F00" stroke-width="2"/>
      <circle cx="50" cy="50" r="30" fill="none" stroke="#C47F00" stroke-width="2.5" stroke-dasharray="3 4"/>
      <g fill="#B26F00"><rect x="33" y="47" width="34" height="6" rx="2"/><rect x="26" y="38" width="7" height="24" rx="2"/><rect x="67" y="38" width="7" height="24" rx="2"/></g>
    </svg>
    <div class="t">コイン</div>
    <div class="s">ためる・使う</div>
  </div>
</div>
</body>
</html>
