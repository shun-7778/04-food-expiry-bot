<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: two tabs (weekly stamp rally toward Mt. Fuji / coins) on the left, LINE preview beside it, stacking on phones.
   Deliberately light-only (white base, bright inks) as requested. Seasonal art stays faint behind the road. */
:root {
  color-scheme: light;
  --bg: #FFFFFF;
  --surface: #F5F8FB;
  --fg: #22303A;
  --muted: #6B7A86;
  --line: #E2E9EF;
  --accent: #12A99B;
  --accent-deep: #0B7F74;
  --accent-soft: #DDF6F2;
  --road: #FFC94D;
  --road-edge: #F0A21C;
  --path: #FFE4A0;
  --path-edge: #F8CB72;
  --road-done: #5FD3C4;
  --road-done-edge: #12A99B;
  --chat-bg: #EAF3FA;
  --ink-red: #F0473C;
  --ink-blue: #2F7BF6;
  --ink-green: #17B169;
  --ink-pink: #F2508E;
  --ink-orange: #FF8A1F;
  --ink-purple: #8C5CF5;
  --gold: #F5B300;
  --gold-deep: #C47F00;
  --gold-soft: #FFF3C4;
  --fuji: #5E8FD0;
  --danger: #D93A30;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.7;
}
.wrap {
  max-width: 1100px; margin: 0 auto;
  padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px;
}
header { display: grid; gap: 2px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 7vw, 46px); line-height: 1.15; margin: 0; text-wrap: balance; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
h1 svg { width: clamp(44px, 9vw, 60px); height: auto; flex: 0 0 auto; }

.main { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } }
.board-col { display: grid; gap: 16px; min-width: 0; }
.side { display: grid; gap: 16px; min-width: 0; position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); }
@media (max-width: 860px) { .side { position: static; } }

/* tabs */
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface); padding: 5px; border-radius: 16px;
  position: sticky; top: calc(8px + env(safe-area-inset-top, 0px)); z-index: 6; box-shadow: 0 0 0 8px var(--bg); }
.tab {
  font: inherit; font-weight: 700; font-size: 15px; border: 0; border-radius: 12px; padding: 10px 8px; cursor: pointer;
  background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px;
}
.tab svg { width: 22px; height: 22px; flex: 0 0 22px; }
.tab[aria-selected="true"] { background: var(--accent); color: #fff; box-shadow: 0 3px 0 var(--accent-deep); }
.coin-num {
  display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 4px; border-radius: 999px;
  background: radial-gradient(circle at 38% 32%, #FFE68A, #F5B300 60%, #D99100); border: 2px solid var(--gold-deep);
  font-family: var(--font-display); font-size: 16px; line-height: 1; color: #5A3A00; font-variant-numeric: tabular-nums;
}
.tab:focus-visible { outline: 3px solid var(--ink-blue); outline-offset: 2px; }

/* progress */
.progress {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;
  background: var(--surface); border-radius: 18px; padding: 14px 16px;
}
.line-stats {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px;
  background: var(--surface); border-radius: 14px; padding: 8px 16px; font-size: 14px; font-weight: 700; color: var(--muted);
}
.line-stats b { font-family: var(--font-display); font-weight: 400; font-size: 22px; color: var(--fg); font-variant-numeric: tabular-nums; }
.line-stats .gold, .line-stats .gold b { color: var(--gold-deep); }
.stat { display: grid; gap: 2px; min-width: 0; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-family: var(--font-display); font-size: clamp(22px, 5vw, 30px); line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .v small { font-family: var(--font-body); font-weight: 700; font-size: 13px; color: var(--muted); margin-left: 2px; }
.stat.gold .v { color: var(--gold-deep); }
.period { font-size: 12px; color: var(--muted); text-align: center; }

/* board */
.road { position: relative; width: 100%; max-width: 580px; margin: 0 auto; aspect-ratio: 400 / 1480; }
.road svg.path { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.road svg.path path.r { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.p-edge { stroke: var(--path-edge); stroke-width: 40; }
.p-base { stroke: var(--path); stroke-width: 32; }
.p-done-edge { stroke: var(--road-done-edge); stroke-width: 40; }
.p-done { stroke: var(--road-done); stroke-width: 32; }
.p-dash { stroke: #FFFFFF; stroke-width: 3; stroke-dasharray: 8 10; opacity: .9; }
.deco { opacity: .6; }

.node {
  position: absolute; width: 21%; transform: translate(-50%, -50%);
  font: inherit; color: inherit; background: transparent; border: 0; padding: 0; cursor: default;
}
.slot {
  position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 50%;
  background: var(--bg); border: 4px solid var(--road-edge); display: grid; place-items: center;
  box-shadow: 0 3px 0 var(--road-edge);
}
.slot .num { font-family: var(--font-display); color: #D0A24A; font-size: clamp(15px, 4vw, 24px); }
.node.done .slot { border-color: var(--road-done-edge); box-shadow: 0 3px 0 var(--road-done-edge); }
.node.paid .slot { border-color: var(--gold); box-shadow: 0 3px 0 var(--gold-deep); }
.node.next { cursor: pointer; z-index: 3; }
.node.next .slot { border: 4px dashed var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 6px rgba(18,169,155,.18); animation: pulse 1.6s ease-in-out infinite; }
.node.next .slot .num { color: var(--accent); font-size: clamp(24px, 6vw, 36px); }
.cap {
  position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 5px;
  white-space: nowrap; font-size: 13px; font-weight: 900; color: var(--fg); line-height: 1.25; text-align: center;
  background: var(--bg); padding: 1px 7px; border-radius: 8px; font-variant-numeric: tabular-nums;
}
.cap.next { color: var(--accent); }
.cap .rw { display: block; font-size: 11px; color: #fff; background: linear-gradient(135deg, #F5B300, #FF8A1F); border-radius: 999px; padding: 1px 8px; margin-top: 2px; }
.cap .cn { color: var(--gold-deep); font-size: 11px; margin-left: 3px; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

.node.mys { width: 23%; z-index: 2; }
.node.mys .slot { border-color: var(--gold); background: var(--gold-soft); box-shadow: 0 3px 0 var(--gold-deep), 0 0 0 6px rgba(245,179,0,.18), 0 8px 20px rgba(245,179,0,.35); }
.node.mys.next .slot { border: 4px dashed var(--gold-deep); background: var(--gold-soft); animation: pulse 1.6s ease-in-out infinite; }
.node.mys.done .slot { box-shadow: 0 3px 0 var(--gold-deep); }
.node.done { cursor: pointer; }
/* プチご褒美：普通のマスと同じ大きさ、ピンクの小さい箱 */
.node.petit .slot { border-color: var(--ink-pink); background: #FFF0F5; box-shadow: 0 3px 0 #C9476F; }
.node.petit.next .slot { border: 4px dashed var(--ink-pink); background: #FFF0F5; animation: pulse 1.6s ease-in-out infinite; }
.node.petit .gift { width: 56%; height: 56%; }
.banner.petit { background: linear-gradient(135deg, #F7A8C4, #F2508E); font-size: clamp(10px, 2.5vw, 12px); padding: 1px 9px; box-shadow: none; }
/* ゴール：富士山 */
.node.goalnode .slot { border-color: var(--fuji); background: #EAF2FC; box-shadow: 0 3px 0 #3E6FB0; }
.node.goalnode.next .slot { border: 4px dashed var(--fuji); background: #EAF2FC; animation: pulse 1.6s ease-in-out infinite; }
.node.goalnode .slot > svg.fj { width: 72%; height: auto; }
.gift { width: 76%; height: 76%; animation: bob 2.4s ease-in-out infinite; }
.spark { position: absolute; width: 22%; height: 22%; pointer-events: none; animation: twinkle 1.8s ease-in-out infinite; }
.spark path { fill: var(--gold); }
.spark.s1 { top: -10%; right: -8%; }
.spark.s2 { bottom: 4%; left: -14%; animation-delay: .6s; width: 16%; height: 16%; }
.spark.s3 { top: 14%; left: -10%; animation-delay: 1.2s; width: 12%; height: 12%; }
.banner {
  position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 6px; white-space: nowrap;
  font-family: var(--font-display); font-size: clamp(11px, 2.8vw, 14px); color: #fff;
  background: linear-gradient(135deg, #FF6A3D, #F0473C 45%, #F2508E);
  padding: 2px 12px; border-radius: 999px; box-shadow: 0 4px 10px rgba(240,71,60,.35);
}
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-6%) rotate(4deg); } }
@keyframes twinkle { 0%,100% { transform: scale(.4); opacity: .2; } 50% { transform: scale(1); opacity: 1; } }

.flag {
  position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
  font-family: var(--font-display); font-size: clamp(12px, 3vw, 15px); color: #fff;
  padding: 3px 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px;
}
.flag.start { background: var(--accent); }
.flag.goal { background: linear-gradient(135deg, #FF6A3D, #F0473C 45%, #F2508E); box-shadow: 0 4px 12px rgba(240,71,60,.3); }
.flag.goal svg { width: 1.6em; height: auto; }

.stamp { position: absolute; inset: 5%; width: 90%; height: 90%; transform: rotate(var(--r)); }
.stamp text { font-family: var(--font-display); }
span.stamp > svg { display: block; width: 100%; height: 100%; }
.just .stamp { animation: thud .5s cubic-bezier(.2,.9,.3,1.35) both; }
.just .slot { animation: shake .35s .3s ease-out; }
@keyframes thud { from { transform: scale(2.4) rotate(var(--r)); opacity: 0; } 55% { opacity: 1; } to { transform: scale(1) rotate(var(--r)); opacity: 1; } }
@keyframes shake { 0%,100% { translate: 0 0; } 30% { translate: 2px 3px; } 60% { translate: -2px -1px; } }

/* coins */
.coin-card { display: grid; gap: 14px; background: var(--surface); border-radius: 22px; padding: 18px 16px; }
.coin-rule { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }
.coin-card h3 { margin: 0; font-size: 14px; text-align: center; }
.coin-card h3 small { font-weight: 500; color: var(--muted); font-size: 12px; margin-left: 4px; }
.tray { display: flex; align-items: center; justify-content: center; gap: clamp(6px, 2vw, 12px); flex-wrap: wrap; }
.tray { display: grid; gap: 14px; }
.tray-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: clamp(4px, 2vw, 12px); justify-items: center; }
.tslot { display: grid; justify-items: center; gap: 2px; width: 100%; max-width: 88px; min-width: 0; font: inherit; color: inherit; background: transparent; border: 0; padding: 0; }
.tslot .hole {
  width: 100%; aspect-ratio: 1; border-radius: 50%; border: 3px dashed #D9C27A; background: var(--bg); position: relative;
  display: grid; place-items: center; font-family: var(--font-display); color: #D9C27A; font-size: clamp(16px, 5vw, 24px);
}
.tslot.filled .hole { border: none; background: transparent; }
.tslot .hole svg.cf { position: absolute; inset: 0; width: 100%; height: 100%; }
.tslot .hole .gift { width: 80%; height: 80%; }
.tslot.goal .hole { border: 3px solid var(--gold); background: var(--gold-soft); }
.tslot.goal.filled .hole { border: 3px solid var(--gold); background: var(--gold-soft); }
.tslot .gbadge { position: absolute; right: -14%; top: -14%; width: 52%; height: 52%; }
.tslot .gbadge .gift { width: 100%; height: 100%; animation: none; }
.tslot .d { font-size: clamp(10px, 3vw, 12px); font-weight: 900; min-height: 1.3em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tslot.goal .d { color: var(--danger); }
.tslot.just .hole svg.cf { animation: flipIn .6s cubic-bezier(.2,.9,.3,1.3) both; }
.tslot.ready { cursor: pointer; }
.tslot.ready .hole { border: 4px dashed var(--danger); animation: pulse 1.6s ease-in-out infinite; }
.tslot.ready:focus-visible { outline: 3px solid var(--ink-blue); outline-offset: 3px; border-radius: 12px; }
.tray-extra { font-size: 12px; font-weight: 900; color: var(--gold-deep); }
.choice { background: rgba(255,255,255,.82); }
.choice-card {
  position: relative; z-index: 1; width: min(380px, 100%); text-align: center; display: grid; gap: 8px; justify-items: center;
  background: var(--bg); border: 4px solid var(--gold); border-radius: 28px; padding: 24px 20px 20px;
  box-shadow: 0 18px 44px rgba(196,127,0,.3); animation: pop .5s cubic-bezier(.2,.9,.3,1.4) both;
}
.choice-card .pile { position: relative; width: 150px; height: 96px; }
.choice-card .pile svg { position: absolute; width: 64px; height: 64px; }
.choice-card h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(22px, 6vw, 28px); margin: 0; color: var(--gold-deep); }
.choice-card p { margin: 0 0 6px; font-size: 14px; color: var(--muted); }
.choice-card .btns { display: grid; gap: 8px; width: 100%; }
.coin-sep { border: 0; border-top: 1px dashed #D9C27A; margin: 0; }
.wallet { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 92px; align-items: center; }
.cslot { display: grid; justify-items: center; gap: 2px; width: clamp(60px, 17vw, 88px); }
.cslot .hole { width: 100%; aspect-ratio: 1; position: relative; }
.cslot .hole svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.cslot .d { font-size: 12px; font-weight: 900; font-variant-numeric: tabular-nums; }
.cslot.just .hole svg { animation: flipIn .6s cubic-bezier(.2,.9,.3,1.3) both; }
.wallet .empty { color: var(--muted); font-size: 13px; }
@keyframes flipIn { from { transform: translateY(-60%) rotateY(540deg) scale(1.4); opacity: 0; } to { transform: none; opacity: 1; } }

/* buttons */
.btn {
  font: inherit; font-weight: 900; font-size: 17px; border-radius: 16px; cursor: pointer;
  padding: 14px 28px; border: 0; background: var(--accent); color: #fff;
  box-shadow: 0 4px 0 var(--accent-deep);
}
.btn.coin { background: var(--gold); box-shadow: 0 4px 0 var(--gold-deep); }
.btn:active { transform: translateY(2px); }
.btn[disabled] { background: var(--line); color: var(--muted); cursor: default; box-shadow: none; transform: none; }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 500; padding: 8px 12px; font-size: 13px; box-shadow: none; }
.btn.use { background: var(--bg); color: var(--gold-deep); border: 3px solid var(--gold); box-shadow: 0 4px 0 var(--gold-deep); font-size: 15px; padding: 10px 14px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn.use svg { width: 24px; height: 24px; flex: 0 0 24px; }
.btn.use .cnt { font-family: var(--font-display); font-size: 13px; background: #FFD34D; color: #6B4300; border-radius: 999px; padding: 0 8px; }
.btn.danger { background: var(--danger); box-shadow: none; font-size: 14px; padding: 8px 16px; }
.btn:focus-visible, .node:focus-visible { outline: 3px solid var(--ink-blue); outline-offset: 3px; }
.sticky-act {
  position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  display: flex; justify-content: center; align-items: stretch; gap: 8px; flex-wrap: nowrap;
}
.sticky-act > .btn { flex: 0 1 auto; min-width: 0; }
.sticky-act > span { flex: 0 0 auto; display: flex; }
.sticky-act > span:empty { display: none; }
.sticky-act .btn:not([disabled]) { box-shadow: 0 4px 0 var(--accent-deep), 0 10px 24px rgba(34,48,58,.18); }
.sticky-act .btn.use { box-shadow: 0 4px 0 var(--gold-deep), 0 10px 24px rgba(34,48,58,.18); height: 100%; }
@media (max-width: 440px) {
  .sticky-act .btn { padding: 12px 12px; font-size: 14px; }
  .sticky-act .btn.use { padding: 8px 10px; font-size: 13px; gap: 4px; }
  .sticky-act .btn.use svg { width: 20px; height: 20px; flex-basis: 20px; }
}
.sticky-act .btn.coin:not([disabled]) { box-shadow: 0 4px 0 var(--gold-deep), 0 10px 24px rgba(34,48,58,.18); }
.sub-act { display: flex; justify-content: center; }
.hint { text-align: center; font-size: 13px; color: var(--muted); margin: 0; }
.hint:empty { display: none; }

.erase { display: grid; justify-items: center; gap: 8px; }
.erase p { margin: 0; font-size: 14px; text-align: center; }
.erase .row { display: flex; gap: 8px; }
.demo { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.demo-label { font-size: 11px; color: var(--muted); text-align: center; letter-spacing: .08em; }

/* side */
.chat { background: var(--chat-bg); border-radius: 18px; padding: 14px; display: grid; gap: 10px; }
.chat-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; gap: 8px; }
.chat-head b { font-family: var(--font-display); font-weight: 400; font-size: 15px; }
.chat-head span { color: var(--muted); font-size: 11px; }
.msg { display: flex; gap: 8px; align-items: flex-end; max-width: 100%; }
.msg.me { justify-content: flex-end; }
.avatar { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.bubble { background: var(--bg); border-radius: 16px; padding: 8px 12px; font-size: 14px; line-height: 1.55; min-width: 0; overflow-wrap: anywhere; }
.msg.me .bubble { background: var(--accent); color: #fff; }
.time { font-size: 10px; color: var(--muted); white-space: nowrap; }
.bubble.img { padding: 6px; width: 110px; }
.bubble.img .slot { border: none; box-shadow: none; background: transparent; }
.qr { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.qr span { font-size: 12px; border: 1px solid var(--accent); color: var(--accent); background: var(--bg); border-radius: 999px; padding: 3px 10px; }
.qr span.c { border-color: var(--gold); color: var(--gold-deep); }
.chat .day { text-align: center; font-size: 11px; color: var(--muted); }
.husband { background: var(--surface); border-radius: 14px; padding: 14px; display: grid; gap: 4px; font-size: 14px; }
.husband .k { font-size: 12px; color: var(--muted); }
.notes { font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
.notes h2 { font-size: 14px; margin: 0; color: var(--fg); }
.notes ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }

/* overlays */
.overlay { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; overflow: hidden; }
.overlay canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.cheer { background: rgba(255,255,255,.7); cursor: pointer; }
.cheer-card {
  position: relative; z-index: 1; width: min(340px, 100%); text-align: center; display: grid; gap: 4px; justify-items: center;
  background: var(--bg); border: 3px solid var(--accent); border-radius: 26px; padding: 22px 20px 18px;
  box-shadow: 0 18px 44px rgba(34,48,58,.22);
  animation: pop .45s cubic-bezier(.2,.9,.3,1.4) both;
}
.cheer-card.coin { border-color: var(--gold); }
.cheer-card .big { position: relative; width: 140px; height: 140px; }
.cheer-card .big .slot { position: absolute; inset: 0; border: none; box-shadow: none; background: transparent; }
.cheer-card .big .stamp { animation: thud .55s .1s cubic-bezier(.2,.9,.3,1.35) both; }
.cheer-card .big .coinsvg { position: absolute; inset: 0; width: 100%; height: 100%; animation: flipIn .7s cubic-bezier(.2,.9,.3,1.3) both; }
.cheer-kicker { font-family: var(--font-display); font-size: 14px; color: var(--accent); }
.cheer-card.coin .cheer-kicker { color: var(--gold-deep); }
.cheer-title { font-family: var(--font-display); font-weight: 400; font-size: clamp(24px, 7vw, 30px); margin: 0; line-height: 1.2; }
.cheer-card p { margin: 2px 0 0; font-size: 15px; }
.cheer-card small { color: var(--muted); font-size: 12px; margin-top: 6px; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.party { background: rgba(255,255,255,.88); }
.popper { position: absolute; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: clamp(80px, 18vw, 130px); z-index: 1; }
.popper.l { left: max(10px, env(safe-area-inset-left, 0px)); transform-origin: 20% 80%; }
.popper.r { right: max(10px, env(safe-area-inset-right, 0px)); transform-origin: 80% 80%; }
.party.open .popper.l { animation: kickL .5s ease-out; }
.party.open .popper.r { animation: kickR .5s ease-out; }
@keyframes kickL { 0% { transform: rotate(0); } 25% { transform: rotate(-14deg) scale(1.1); } 100% { transform: rotate(0); } }
@keyframes kickR { 0% { transform: rotate(0); } 25% { transform: rotate(14deg) scale(1.1); } 100% { transform: rotate(0); } }
.party-card {
  position: relative; z-index: 1; width: min(440px, 100%); text-align: center; display: grid; gap: 6px; justify-items: center;
  background: var(--bg); border: 5px solid var(--gold); border-radius: 30px; padding: 28px 22px 22px;
  box-shadow: 0 0 0 12px rgba(245,179,0,.22), 0 24px 60px rgba(196,127,0,.4);
  animation: pop .6s cubic-bezier(.2,.9,.3,1.4) both;
}
.party.open .party-card { animation: bigShake .6s ease-out; }
@keyframes bigShake { 0%,100% { transform: scale(1); } 20% { transform: scale(1.08) rotate(-2deg); } 40% { transform: scale(1.04) rotate(2deg); } 60% { transform: scale(1.02); } }
.party-kicker { font-family: var(--font-display); font-size: 16px; color: var(--danger); letter-spacing: .06em; }
.reveal { position: relative; width: 170px; height: 170px; display: grid; place-items: center; }
.reveal .box, .reveal .slot, .reveal .coinsvg { position: absolute; inset: 0; width: 100%; height: 100%; }
.reveal .slot { border: none; box-shadow: none; background: transparent; opacity: 0; transform: scale(.3); }
.party.open .reveal .box { animation: boxOut .5s ease-in forwards; }
.party.open .reveal .slot { animation: medalIn .6s .35s cubic-bezier(.2,.9,.3,1.4) forwards; }
.party:not(.open) .reveal .box { animation: wiggle .5s ease-in-out infinite; }
@keyframes wiggle { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
/* 「あける」を押すと、揺れがだんだん速く大きくなって爆発する */
.party.shaking:not(.open) .reveal .box { animation: rumble 1.8s cubic-bezier(.4,0,1,1) forwards; }
@keyframes rumble {
  0% { transform: rotate(0) scale(1); }
  12% { transform: rotate(-6deg); } 23% { transform: rotate(6deg); }
  32% { transform: rotate(-7deg); } 40% { transform: rotate(7deg) scale(1.02); }
  47% { transform: rotate(-8deg); } 53% { transform: rotate(8deg) scale(1.04); }
  58% { transform: rotate(-9deg); } 63% { transform: rotate(9deg) scale(1.06); }
  67% { transform: rotate(-10deg); } 71% { transform: rotate(10deg) scale(1.08); }
  74% { transform: rotate(-11deg); } 77% { transform: rotate(11deg) scale(1.1); }
  80% { transform: rotate(-12deg); } 82.5% { transform: rotate(12deg) scale(1.12); }
  85% { transform: rotate(-13deg); } 87% { transform: rotate(13deg) scale(1.14); }
  89% { transform: rotate(-14deg); } 91% { transform: rotate(14deg) scale(1.16); }
  92.5% { transform: rotate(-15deg); } 94% { transform: rotate(15deg) scale(1.18); }
  95.5% { transform: rotate(-15deg); } 97% { transform: rotate(15deg) scale(1.2); }
  98.5% { transform: rotate(-8deg) scale(1.24); } 100% { transform: rotate(0) scale(1.3); }
}
.reveal .burst { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; opacity: 0;
  background: radial-gradient(circle, #FFFFFF 0 20%, #FFE68A 35%, rgba(255,201,77,.6) 55%, rgba(255,201,77,0) 70%); }
.reveal .rays { position: absolute; inset: -40%; width: 180%; height: 180%; pointer-events: none; opacity: 0; }
.party.open .reveal .burst { animation: burst .6s ease-out; }
.party.open .reveal .rays { animation: rays .8s ease-out; }
@keyframes burst { 0% { opacity: 1; transform: scale(.4); } 100% { opacity: 0; transform: scale(3.2); } }
@keyframes rays { 0% { opacity: 1; transform: scale(.3) rotate(0); } 100% { opacity: 0; transform: scale(1.3) rotate(25deg); } }
@keyframes boxOut { to { transform: scale(1.7) rotate(12deg); opacity: 0; } }
@keyframes medalIn { to { opacity: 1; transform: scale(1); } }
.party-title { font-family: var(--font-display); font-weight: 400; font-size: clamp(32px, 9vw, 44px); line-height: 1.15; margin: 0;
  background: linear-gradient(135deg, #FF6A3D, #F0473C 40%, #F2508E); -webkit-background-clip: text; background-clip: text; color: transparent; }
.party-reward { font-family: var(--font-display); font-size: clamp(24px, 7vw, 32px); color: var(--gold-deep); min-height: 1.4em; }
.party-card p { margin: 0 0 8px; color: var(--muted); }
.party:not(.open) .party-reward, .party:not(.open) .party-title { display: none; }
.party-card p:empty { display: none; }
.party-art { width: 76px; height: 76px; opacity: .9; }
.party-art svg { width: 100%; height: 100%; }
.party-art:empty, .party:not(.open) .party-art { display: none; }
/* プチご褒美は控えめに */
.party.petit .popper { display: none; }
.party.petit .party-card { border-color: var(--ink-pink); box-shadow: 0 0 0 8px rgba(242,80,142,.15), 0 18px 44px rgba(242,80,142,.25); }
.party.petit .reveal { width: 130px; height: 130px; }
.party.petit .party-title { font-size: clamp(24px, 7vw, 32px); }
/* 押したあとのマスを見返すとき：演出なしで開いた状態を出す */
.party.quiet .popper, .party.quiet .reveal .box, .party.quiet .reveal .burst, .party.quiet .reveal .rays { display: none; }
.party.quiet .reveal .slot { animation: none; opacity: 1; transform: none; }
.party.quiet .party-card { animation: pop .3s ease-out both; }
.party-close {
  position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--surface); color: var(--muted); font-size: 24px; line-height: 1; display: grid; place-items: center;
}
.party-close:focus-visible { outline: 3px solid var(--ink-blue); outline-offset: 2px; }
button { touch-action: manipulation; }

@media (prefers-reduced-motion: reduce) {
  .node.next .slot, .just .stamp, .just .slot, .gift, .spark, .popper, .reveal .box, .reveal .slot,
  .cheer-card, .choice-card, .tslot.ready .hole, .tslot.just .hole svg.cf, .cheer-card .big .stamp, .cheer-card .big .coinsvg, .cslot.just .hole svg, .party-card { animation: none !important; }
  .party.open .reveal .box { opacity: 0; }
  .party.open .reveal .slot { opacity: 1; transform: none; }
  .reveal .burst, .reveal .rays { animation: none !important; }
}
/* ---- 本番用の土台（試作では Artifact が自動で付けていたもの） ---- */
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
/* ---- 本番用：1列、読み込み中・記録中・エラー ---- */
.wrap { max-width: 620px; }
.loading { text-align: center; color: var(--muted); padding: 40px 0; }
.busy { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 40;
  background: var(--fg); color: #fff; font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 999px; }
/* body に付けるのは is-busy（.busy にすると上のバッジの見た目が body 全体に効き、画面が黒く細くなる） */
body.is-busy .board-col { pointer-events: none; }
.err { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 41;
  width: min(420px, calc(100% - 32px)); background: #FFF0EE; color: var(--danger); border: 2px solid var(--danger);
  font-size: 14px; font-weight: 700; padding: 10px 14px; border-radius: 14px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="coinFace" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#FFE68A"/><stop offset=".55" stop-color="#F5B300"/><stop offset="1" stop-color="#D99100"/>
    </radialGradient>
    <linearGradient id="season" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFEBDD"/><stop offset=".2" stop-color="#FFF3E6"/>
      <stop offset=".28" stop-color="#EEF5FD"/><stop offset=".5" stop-color="#E8F2FC"/>
      <stop offset=".58" stop-color="#FFF0F5"/><stop offset=".7" stop-color="#FFF3F7"/>
      <stop offset=".78" stop-color="#EEF9EF"/><stop offset="1" stop-color="#E6F4FF"/>
    </linearGradient>
    <symbol id="fujiIcon" viewBox="0 0 64 40">
      <path d="M2 38 L24 8 Q32 2 40 8 L62 38 Z" fill="#5E8FD0"/>
      <path d="M24 8 Q32 2 40 8 L46 16 L41 14 L37 18 L32 13 L27 18 L23 14 L18 16 Z" fill="#FFFFFF"/>
    </symbol>
  </defs>
</svg>

<span id="k" hidden><?= token ?></span>
<span id="t" hidden><?= tab ?></span>

<div class="wrap">
  <header>
    <h1>Let's Go Mt.Fuji！！</h1>
  </header>

  <div id="loading" class="loading">読み込み中…</div>

  <section class="board-col" id="app" hidden aria-label="スタンプ台紙">
    <div class="tabs" role="tablist" aria-label="記録の種類">
      <button type="button" class="tab" role="tab" id="tabStamp" aria-controls="panelStamp" aria-selected="true">週1スタンプ</button>
      <button type="button" class="tab" role="tab" id="tabCoin" aria-controls="panelCoin" aria-selected="false">
        <span class="coin-num" id="coinBadge" aria-label="手持ちのコイン">0</span>コイン
      </button>
    </div>

    <div id="panelStamp" role="tabpanel" aria-labelledby="tabStamp" style="display:grid;gap:16px">
      <div class="line-stats">
        <span>すすんだマス <b id="sCount">0</b> / <span id="sTotal">40</span></span>
        <span class="gold" id="sNext"></span>
      </div>
      <div id="board"></div>
      <div class="sticky-act"><button type="button" class="btn" id="stampBtn">今週ジムに行った！</button><span id="useWrapStamp"></span></div>
      <!-- ここに「最後のスタンプを1つ消す」（#erase）が render で差し込まれる -->
      <p class="hint" id="stampHint"></p>
    </div>

    <div id="panelCoin" role="tabpanel" aria-labelledby="tabCoin" hidden style="gap:16px">
      <div class="line-stats">
        <span>ためた <b id="cEarned">0</b> ・ 使った <b id="cUsed">0</b></span>
        <span class="gold" id="cNext"></span>
      </div>
      <div class="coin-card">
        <div class="tray" id="tray"></div>
      </div>
      <div class="sticky-act"><button type="button" class="btn coin" id="coinBtn">今週もう1回行った！</button><span id="useWrapCoin"></span></div>
    </div>

    <div class="erase" id="erase"></div>
  </section>
</div>

<div class="busy" id="busy" hidden aria-live="polite"><span>記録中…</span></div>
<div class="err" id="err" hidden role="alert"></div>

<div class="overlay cheer" id="cheer" hidden role="status" aria-live="polite">
  <canvas id="cheerFx"></canvas>
  <div class="cheer-card" id="cheerCard">
    <div class="cheer-kicker" id="cheerKicker"></div>
    <div class="big" id="cheerBig"></div>
    <h2 class="cheer-title" id="cheerTitle"></h2>
    <p id="cheerText"></p>
    <small>タップでとじる</small>
  </div>
</div>

<div class="overlay choice" id="choice" hidden role="dialog" aria-modal="true" aria-labelledby="choiceTitle">
  <canvas id="choiceFx"></canvas>
  <div class="choice-card">
    <div class="pile" id="choicePile"></div>
    <h2 id="choiceTitle">コインが5枚たまった！</h2>
    <p id="choiceText">5枚でご褒美と交換できます。ためておけば、行けない週の穴埋めにも使えます。</p>
    <div class="btns">
      <button type="button" class="btn coin" id="exchangeBtn">ご褒美と交換する（5枚使う）</button>
      <button type="button" class="btn ghost" id="keepBtn">ためておく</button>
    </div>
  </div>
</div>

<div class="overlay party" id="party" hidden role="dialog" aria-modal="true" aria-labelledby="partyTitle">
  <svg class="popper l" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M8 92 L40 30 L70 60 Z" fill="var(--ink-pink)"/>
    <path d="M18 72 L48 38 M26 86 L60 50" stroke="var(--gold)" stroke-width="6"/>
    <ellipse cx="55" cy="45" rx="22" ry="8" transform="rotate(45 55 45)" fill="var(--ink-purple)"/>
  </svg>
  <svg class="popper r" viewBox="0 0 100 100" aria-hidden="true"><g transform="translate(100 0) scale(-1 1)">
    <path d="M8 92 L40 30 L70 60 Z" fill="var(--ink-blue)"/>
    <path d="M18 72 L48 38 M26 86 L60 50" stroke="var(--gold)" stroke-width="6"/>
    <ellipse cx="55" cy="45" rx="22" ry="8" transform="rotate(45 55 45)" fill="var(--ink-orange)"/>
  </g></svg>
  <canvas id="partyFx"></canvas>
  <div class="party-card">
    <div class="party-kicker" id="partyKicker"></div>
    <div class="reveal">
      <svg class="box" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M50 30 C40 14 22 16 28 27 C32 33 44 31 50 30Z M50 30 C60 14 78 16 72 27 C68 33 56 31 50 30Z" fill="var(--ink-red)"/>
        <rect x="18" y="44" width="64" height="44" rx="5" fill="var(--gold)"/>
        <rect x="14" y="30" width="72" height="16" rx="4" fill="var(--gold)" stroke="var(--gold-deep)" stroke-width="2"/>
        <rect x="44" y="30" width="12" height="58" fill="var(--ink-red)"/>
        <text x="50" y="80" text-anchor="middle" font-size="22" fill="#fff" font-family="Dela Gothic One, sans-serif">?</text>
      </svg>
      <span class="slot" id="partyStamp"></span>
      <svg class="rays" viewBox="-50 -50 100 100" aria-hidden="true" id="partyRays"></svg>
      <span class="burst" aria-hidden="true"></span>
    </div>
    <h2 class="party-title" id="partyTitle">ご褒美ゲット！</h2>
    <div class="party-reward" id="partyReward"></div>
    <div class="party-art" id="partyArt" aria-hidden="true"></div>
    <p id="partyText"></p>
    <button type="button" class="btn" id="partyBtn">あける</button>
    <button type="button" class="party-close" id="partyClose" aria-label="とじる">×</button>
  </div>
</div>

<script>
(function () {
  var TOKEN = document.getElementById('k').textContent.trim();
  var START_TAB = document.getElementById('t').textContent.trim() === 'coin' ? 'coin' : 'stamp';
  var WD = ['日', '月', '火', '水', '木', '金', '土'];

  // サーバーから受け取った状態（logic.gs の gymState_）と、画面だけの状態
  var ST = null;
  var V = { tab: START_TAB, just: null, erasing: false, busy: false };

  var INKS = { dumbbell: '--ink-blue', heart: '--ink-pink', star: '--ink-green', sakura: '--ink-red', flame: '--ink-orange', hanamaru: '--ink-purple' };

  // ---- dates（'yyyy-MM-dd'） ----
  function md(ymd) { var p = ymd.split('-'); return Number(p[1]) + '/' + Number(p[2]); }
  function mdw(ymd) { var p = ymd.split('-'); return md(ymd) + '（' + WD[new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay()] + '）'; }
  function kindLabel(type) { return type === 'petit' ? 'プチご褒美' : type === 'goal' ? 'ゴール' : 'ご褒美'; }

  // ---- server ----
  function call(fn, args, done) {
    if (V.busy) return;
    // 読み直し（webState）は記録ではないので「記録中…」を出さず、裏で静かに差し替える
    setBusy(true, fn !== 'webState');
    var runner = google.script.run
      .withSuccessHandler(function (res) {
        setBusy(false);
        ST = res.state;
        render();
        if (done) done(res.event);
      })
      .withFailureHandler(function (err) {
        setBusy(false);
        showError(err && err.message ? err.message : String(err));
      });
    runner[fn].apply(runner, [TOKEN].concat(args || []));
  }
  // 結果を待たずに投げるだけ（箱を開けたことの連絡）
  function tell(fn, args) {
    var r = google.script.run.withFailureHandler(function (err) { console.warn(err); });
    r[fn].apply(r, [TOKEN].concat(args || []));
  }
  function setBusy(on, badge) {
    V.busy = on;
    document.body.classList.toggle('is-busy', on);
    document.getElementById('busy').hidden = !(on && badge);
  }
  var errTimer;
  function showError(msg) {
    var el = document.getElementById('err');
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(errTimer);
    errTimer = setTimeout(function () { el.hidden = true; }, 5000);
  }

  // ---- art ----
  function inkOf(kind) {
    if (kind === 'medal') return 'var(--gold-deep)';
    if (kind === 'petit') return 'var(--ink-pink)';
    if (kind === 'goal') return 'var(--fuji)';
    return INKS[kind] ? 'var(' + INKS[kind] + ')' : 'var(--accent)';
  }
  function scallop(cx, cy, r, n) {
    var pts = [];
    for (var i = 0; i <= n; i++) {
      var a = (i / n) * Math.PI * 2 - Math.PI / 2;
      pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
    }
    var ar = (2 * r * Math.sin(Math.PI / n) * 0.58).toFixed(2);
    var p = 'M' + pts[0][0].toFixed(2) + ' ' + pts[0][1].toFixed(2);
    for (var j = 1; j < pts.length; j++) p += ' A' + ar + ' ' + ar + ' 0 0 1 ' + pts[j][0].toFixed(2) + ' ' + pts[j][1].toFixed(2);
    return p + 'Z';
  }
  function disc() {
    return '<circle cx="50" cy="50" r="45" fill="currentColor" fill-opacity=".12"/>' +
      '<circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="5"/>' +
      '<circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="2"/>';
  }
  function label(t, y, size) {
    return '<text x="50" y="' + y + '" text-anchor="middle" font-size="' + size + '" fill="currentColor">' + t + '</text>';
  }
  var DUMBBELL = '<rect x="30" y="39" width="40" height="7" rx="2"/>' +
    '<rect x="21" y="28" width="9" height="29" rx="2"/><rect x="70" y="28" width="9" height="29" rx="2"/>' +
    '<rect x="15" y="34" width="6" height="17" rx="2"/><rect x="79" y="34" width="6" height="17" rx="2"/>';
  function art(kind, n) {
    switch (kind) {
      case 'dumbbell': return disc() + '<g fill="currentColor">' + DUMBBELL + '</g>' + label('NICE!', 76, 15);
      case 'heart':
        return disc() + '<path fill="currentColor" d="M50 61 C32 49 27 40 27 33 C27 25 34 20 40 20 C45 20 48 23 50 27 C52 23 55 20 60 20 C66 20 73 25 73 33 C73 40 68 49 50 61Z"/>' + label('えらい', 80, 15);
      case 'star':
        return disc() + '<polygon fill="currentColor" points="50,17 58,35 77,36 62,48 67,66 50,56 33,66 38,48 23,36 42,35"/>' + label('すごい', 82, 14);
      case 'flame':
        return disc() + '<path fill="currentColor" d="M50 15 C59 28 69 35 67 51 C66 62 58 67 50 67 C42 67 34 62 33 52 C32 44 37 37 42 33 C42 41 45 45 48 46 C46 36 46 25 50 15Z"/>' + label('ファイト', 82, 12);
      case 'sakura':
        return '<path fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-width="5" d="' + scallop(50, 50, 41, 10) + '"/>' + label('よく', 46, 18) + label('できました', 66, 14);
      case 'hanamaru':
        return '<path fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-width="5" d="' + scallop(50, 50, 41, 12) + '"/>' +
          '<path fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" d="M45 50 a5 5 0 1 1 10 0 a10 10 0 1 1 -20 0 a15 15 0 1 1 30 0 a20 20 0 1 1 -40 0 a25 25 0 1 1 50 0"/>';
      case 'medal':
        return '<path fill="var(--gold)" fill-opacity=".35" stroke="currentColor" stroke-width="4" d="' + scallop(50, 50, 44, 16) + '"/>' +
          '<circle cx="50" cy="50" r="32" fill="var(--gold-soft)" stroke="currentColor" stroke-width="2.5"/>' + label(String(n), 60, 32) + label('回達成', 76, 11);
      case 'petit':
        return '<path fill="currentColor" fill-opacity=".14" stroke="currentColor" stroke-width="4" d="' + scallop(50, 50, 42, 10) + '"/>' +
          label('プチ', 48, 18) + label('ご褒美', 68, 14);
      case 'goal':
        return disc() + '<path d="M18 70 L40 36 Q50 28 60 36 L82 70 Z" fill="currentColor"/>' +
          '<path d="M40 36 Q50 28 60 36 L66 45 L60 43 L55 48 L50 43 L45 48 L40 43 L34 45 Z" fill="#FFFFFF"/>' + label('GOAL', 84, 12);
    }
    return '';
  }
  function stampSVG(kind, r, n) {
    return '<svg class="stamp" viewBox="0 0 100 100" style="color:' + inkOf(kind) + ';--r:' + (r || 0) + 'deg" aria-hidden="true"><g filter="url(#ink)">' + art(kind, n) + '</g></svg>';
  }
  function coinSVG(cls) {
    return '<svg class="' + (cls || '') + '" viewBox="0 0 100 100" aria-hidden="true">' +
      '<circle cx="50" cy="52" r="46" fill="#C47F00"/>' +
      '<circle cx="50" cy="48" r="46" fill="url(#coinFace)" stroke="#C47F00" stroke-width="2"/>' +
      '<circle cx="50" cy="48" r="35" fill="none" stroke="#C47F00" stroke-width="2.5" stroke-dasharray="3 4"/>' +
      '<g fill="#B26F00" transform="translate(0 4)">' + DUMBBELL + '</g>' +
      '<path d="M26 26 Q34 16 46 14" stroke="#FFF6CC" stroke-width="5" stroke-linecap="round" fill="none" opacity=".8"/>' +
      '</svg>';
  }
  function cellArt(s) {
    if (s.paid && !s.special) return '<span class="stamp" style="--r:0deg">' + coinSVG() + '</span>';

      t += '</div>';
    }
    document.getElementById('tray').innerHTML = t;

    document.getElementById('cEarned').textContent = total;
    document.getElementById('cUsed').textContent = ST.used;
    document.getElementById('cNext').innerHTML = ST.canExchange ? '<b>交換できます</b>' : 'あと<b>' + (set - held) + '</b>枚でご褒美';
    document.getElementById('coinBadge').textContent = held;
  }

  function renderProgress() {
    var c = ST.squares.length;
    document.getElementById('sCount').textContent = c;
    document.getElementById('sTotal').textContent = ST.total;
    document.getElementById('sNext').innerHTML = ST.next ? 'あと<b>' + (ST.next.n - c) + '</b>マスで' + ST.next.label : '<b>ゴール！</b>';
  }

  function useBtnHTML() {
    return ST.canUse
      ? '<button type="button" class="btn use" data-use="1" aria-label="今週は行けないのでコインを1枚使う（残り' + ST.held + '枚）">' +
        '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="url(#coinFace)" stroke="#C47F00" stroke-width="4"/></svg>' +
        'コインを使う<span class="cnt">' + ST.held + '</span></button>'
      : '';
  }
  function renderButtons() {
    var sb = document.getElementById('stampBtn'), cb = document.getElementById('coinBtn');
    sb.disabled = !(ST.canStamp || ST.canConvert);
    sb.textContent = ST.squares.length >= ST.total && !ST.weekPaid ? 'ゴールしました'
      : ST.canConvert ? '行けた！スタンプに変える' : ST.weekDone ? '今週の分は押しました' : '今週ジムに行った！';
    document.getElementById('useWrapStamp').innerHTML = useBtnHTML();
    document.getElementById('useWrapCoin').innerHTML = useBtnHTML();
    document.getElementById('stampHint').textContent = ST.weekPaid ? '今週はコインで埋めています。行けたらスタンプに変えて、コインは戻ります'
      : ST.weekDone ? 'もう1回行ったらコインがもらえるよ！'
      : ST.canUse ? '行けない週は「コインを使う」で、行ったことにできます' : '';
    cb.disabled = !ST.canEarn;
    cb.textContent = ST.canEarn ? '今週もう1回行った！' : ST.weekPaid ? '今週はコインで埋めた週です'
      : !ST.weekDone ? '先に週1スタンプを押してね' : '今日の分はもらいました';
  }

  function renderErase() {
    var el = document.getElementById('erase'), isStamp = V.tab === 'stamp';
    var what = isStamp ? 'スタンプ' : 'コイン';
    var last = isStamp ? ST.squares[ST.squares.length - 1] : (ST.held > 0 ? ST.coins[ST.coins.length - 1] : null);
    if (!last) { el.innerHTML = '<button type="button" class="btn ghost" disabled>最後の' + what + 'を1つ消す</button>'; return; }
    if (!V.erasing) { el.innerHTML = '<button type="button" class="btn ghost" id="eraseAsk">最後の' + what + 'を1つ消す</button>'; return; }
    var desc = isStamp ? last.n + 'マス目（' + mdw(last.date) + (last.paid ? '・コインで埋めた週。コインは戻ります' : '') + '）のスタンプ'
      : mdw(last.date) + 'にためたコイン';
    el.innerHTML = '<p>' + desc + 'を消します。よろしいですか？</p><div class="row">' +
      '<button type="button" class="btn danger" id="eraseYes">消す</button>' +
      '<button type="button" class="btn ghost" id="eraseNo">やめる</button></div>';
    document.getElementById('eraseNo').focus();
  }

  function render() {
    if (!ST) return;
    var st = V.tab === 'stamp';
    document.getElementById('tabStamp').setAttribute('aria-selected', st);
    document.getElementById('tabCoin').setAttribute('aria-selected', !st);
    document.getElementById('panelStamp').hidden = !st;
    var pc = document.getElementById('panelCoin');
    pc.hidden = st; pc.style.display = st ? '' : 'grid';
    // 「最後の〜を1つ消す」は、開いているタブの大きなボタンのすぐ下に置く
    document.querySelector((st ? '#panelStamp' : '#panelCoin') + ' .sticky-act').after(document.getElementById('erase'));
    document.getElementById('board').innerHTML = renderBoard();
    renderCoins(); renderProgress(); renderButtons(); renderErase();
    document.getElementById('app').hidden = false;
    document.getElementById('loading').hidden = true;
  }

  // ---- confetti ----
  var COLORS;
  function palette() {
    if (COLORS) return COLORS;
    var css = getComputedStyle(document.documentElement);
    COLORS = ['--ink-red', '--ink-blue', '--ink-green', '--ink-pink', '--ink-orange', '--ink-purple', '--gold'].map(function (v) { return css.getPropertyValue(v).trim(); });
    return COLORS;
  }
  var rafs = {};
  function runFx(canvasId, bits, ms) {
    var cv = document.getElementById(canvasId), ctx = cv.getContext('2d');
    var w = cv.width = cv.clientWidth, h = cv.height = cv.clientHeight;
    cancelAnimationFrame(rafs[canvasId]);
    var list = bits(w, h), t0 = performance.now();
    (function tick(t) {
      ctx.clearRect(0, 0, w, h);
      list.forEach(function (b) {
        b.vy += .32; b.vx *= .985; b.vy *= .995; b.x += b.vx; b.y += b.vy; b.rot += b.vr;
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot); ctx.fillStyle = b.c;
        if (b.long) ctx.fillRect(-1.5, -b.s * 1.4, 3, b.s * 2.8); else ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2);
        ctx.restore();
      });
      if (t - t0 < ms) rafs[canvasId] = requestAnimationFrame(tick); else ctx.clearRect(0, 0, w, h);
    })(t0);
  }
  function bit(x, y, ang, sp, i) {
    return { x: x, y: y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, s: 6 + Math.random() * 8, long: Math.random() < .2,
      rot: Math.random() * 6, vr: (Math.random() - .5) * .4, c: palette()[i % palette().length] };
  }
  function reduced() { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  function smallBurstOn(where) {
    if (reduced()) return;
    var id = where === 'choice' ? 'choiceFx' : where === 'party' ? 'partyFx' : 'cheerFx';
    runFx(id, function (w, h) {
      var out = [];
      for (var i = 0; i < 60; i++) out.push(bit(w / 2, h * .42, -Math.PI / 2 + (Math.random() - .5) * 2.2, 6 + Math.random() * 7, i));
      return out;
    }, 2200);
  }
  function bigBurst() {
    if (reduced()) return;
    runFx('partyFx', function (w, h) {
      var out = [], power = Math.max(14, Math.min(w, h) / 30);
      for (var i = 0; i < 160; i++) {
        var ang = (-60 - Math.random() * 25) * Math.PI / 180, sp = power * (.6 + Math.random() * .7);
        out.push(bit(60, h - 60, ang, sp, i));
        out.push(bit(w - 60, h - 60, Math.PI - ang, sp, i + 3));
      }
      for (var j = 0; j < 80; j++) out.push(bit(Math.random() * w, -20, Math.PI / 2, Math.random() * 3, j));
      return out;
    }, 5000);
  }

  // ---- reactions ----
  // ほめる画面はタップで閉じる（自動では閉じない）。quiet=true は見返すとき（紙吹雪なし）
  function showCheer(kind, kicker, title, text, big, quiet) {
    var card = document.getElementById('cheerCard');
    card.className = 'cheer-card' + (kind === 'coin' ? ' coin' : '');
    card.style.animation = 'none'; card.offsetWidth; card.style.animation = '';
    document.getElementById('cheerKicker').textContent = kicker;
    document.getElementById('cheerBig').innerHTML = big;
    document.getElementById('cheerTitle').textContent = title;
    document.getElementById('cheerText').textContent = text;
    document.getElementById('cheer').hidden = false;
    if (!quiet) smallBurstOn('cheer');
  }
  function hideCheer() { document.getElementById('cheer').hidden = true; }

  var pending = null, shakeTimers = [];
  // view=true は押したあとのマスを見返すとき。開いた状態を、クラッカーなしで出す
  function showParty(p, view) {
    pending = p;
    hideCheer();
    var el = document.getElementById('party');
    shakeTimers.forEach(clearTimeout); shakeTimers = [];
    el.classList.remove('open', 'shaking', 'quiet');
    el.classList.toggle('petit', !!p.petit);
    document.getElementById('partyBtn').disabled = false;
    var rays = '';
    for (var k = 0; k < 12; k++) rays += '<path d="M0 -14 L3 -46 L-3 -46 Z" fill="' + (k % 2 ? '#FFC94D' : '#F2508E') + '" transform="rotate(' + k * 30 + ')"/>';
    document.getElementById('partyRays').innerHTML = rays;
    document.getElementById('partyKicker').textContent = p.kicker;
    document.getElementById('partyStamp').innerHTML = p.big;
    document.getElementById('partyTitle').textContent = p.title || 'ご褒美ゲット！';
    document.getElementById('partyReward').textContent = '';
    document.getElementById('partyArt').innerHTML = '';
    document.getElementById('partyText').textContent = '';
    if (view) {
      el.classList.add('open', 'quiet');
      fillOpened();
      document.getElementById('partyBtn').textContent = 'とじる';
    } else {
      document.getElementById('partyBtn').textContent = 'あける';
      document.getElementById('partyClose').setAttribute('aria-label', '押し間違えたので閉じる（取り消す）');
    }
    el.hidden = false;
    document.getElementById('partyBtn').focus();
  }
  function fillOpened() {
    document.getElementById('partyReward').textContent = '「' + pending.reward + '」';
    document.getElementById('partyArt').innerHTML = rewardArt(pending.art);
    document.getElementById('partyText').textContent = pending.after;
    document.getElementById('partyClose').setAttribute('aria-label', 'とじる');
  }
  function openParty() {
    var el = document.getElementById('party'), btn = document.getElementById('partyBtn');
    if (el.classList.contains('open')) { el.hidden = true; return; }
    if (el.classList.contains('shaking')) return;
    if (reduced()) { burstOpen(); return; }
    // 箱を揺らして、最後に爆発させる
    el.classList.add('shaking');
    btn.disabled = true; btn.textContent = 'ドキドキ…';
    shakeTimers.push(setTimeout(burstOpen, 1800));
  }
  function burstOpen() {
    var el = document.getElementById('party'), btn = document.getElementById('partyBtn');
    shakeTimers.forEach(clearTimeout); shakeTimers = [];
    el.classList.remove('shaking');
    btn.disabled = false;
    el.classList.add('open');
    fillOpened();
    btn.textContent = 'やったー！';
    // 開けたことをサーバーに伝える（ここで初めて LINE に知らせる）
    if (pending.id) tell('webOpened', [pending.id]);
    if (pending.petit) { smallBurstOn('party'); return; }
    el.querySelectorAll('.popper').forEach(function (p) { p.style.animation = 'none'; p.offsetWidth; p.style.animation = ''; });
    bigBurst();
  }
  // 開ける前に×で閉じたら、押し間違いとして取り消す。開けたあとは閉じるだけ
  function closeParty() {
    var el = document.getElementById('party');
    shakeTimers.forEach(clearTimeout); shakeTimers = [];
    var opened = el.classList.contains('open');
    el.classList.remove('shaking');
    el.hidden = true;
    if (!opened && pending && pending.id && !pending.view) {
      V.just = null;
      call('webCancel', [pending.id]);
    }
  }
  function specialParty(s, id) {
    var type = s.special;
    if (type === 'goal') {
      return { id: id, kicker: 'GOAL！ ' + ST.total + 'マス完走', title: 'ゴール！', big: stampSVG('goal', 0, s.n), reward: s.name, art: s.art,
        after: '9か月、本当によく続けました。' };
    }
    if (type === 'petit') {
      return { id: id, kicker: s.n + 'マス目はプチご褒美！', title: 'プチご褒美！', big: stampSVG('petit', 0, s.n), reward: s.name, art: s.art, petit: true,
        after: s.paid ? 'ためたコインのおかげ。' : 'ちょっとひと息。この調子！' };
    }
    return { id: id, kicker: s.n + 'マス目はご褒美！', big: stampSVG('medal', 0, s.n), reward: s.name, art: s.art,
      after: s.paid ? 'ためたコインのおかげ。富士山に一歩近づいた！' : '富士山に一歩近づいた！' };
  }

  // ---- actions ----
  function afterSquare(ev) {
    var s = ST.squares[ev.n - 1];
    V.just = { type: 'stamp', i: ev.n - 1 };
    render();
    if (ev.type === 'special') { showParty(specialParty(s, ev.id)); return; }
    if (ev.type === 'use') { showCheer('coin', ev.n + 'マス目', ev.title, ev.text + '来週また行こう。', coinSVG('coinsvg')); return; }
    showCheer('stamp', ev.n + 'マス目' + (ev.type === 'convert' ? 'をスタンプに' : ''), ev.title,
      ev.type === 'convert' ? 'やっぱり行けたね！コインは1枚戻りました。' : ev.text, '<span class="slot">' + stampSVG(s.kind, s.r, s.n) + '</span>');
  }
  function doStamp() { V.erasing = false; call('webStamp', [], afterSquare); }
  function useCoin() { V.erasing = false; V.tab = 'stamp'; call('webUseCoin', [], afterSquare); }
  function earnCoin() {
    V.erasing = false;
    call('webEarnCoin', [], function (ev) {
      V.just = { type: 'coin', i: ST.coins.length - 1 };
      render();
      if (ev.choice) showChoice();
      else showCheer('coin', ST.canExchange ? '手持ち' + ST.held + '枚' : 'ご褒美まであと' + (ST.coinSet - ST.held) + '枚', 'コインゲット！', ev.text + ' 行けない週にも使えます。', coinSVG('coinsvg'));
    });
  }
  // 押したあとのマスをタップ → 押したときと同じ画面（紙吹雪・クラッカーなし）
  function viewSquare(i) {
    var s = ST.squares[i];
    if (!s) return;
    if (s.special) { var p = specialParty(s, s.id); p.view = true; showParty(p, true); return; }
    if (s.paid) { showCheer('coin', s.n + 'マス目（' + mdw(s.date) + '）', s.title || 'コインで今週クリア！', s.text, coinSVG('coinsvg'), true); return; }
    showCheer('stamp', s.n + 'マス目（' + mdw(s.date) + '）', s.title || 'えらい！', s.text, '<span class="slot">' + stampSVG(s.kind, s.r, s.n) + '</span>', true);
  }

  // ---- 5枚たまったら、交換するか、ためておくかを選ぶ ----
  function showChoice() {
    hideCheer();
    var pile = '';
    [[0, 30], [22, 22], [44, 30], [66, 22], [86, 30]].forEach(function (p, k) {
      pile += coinSVG('').replace('<svg class=""', '<svg style="left:' + p[0] + 'px;top:' + p[1] + 'px;z-index:' + k + '"');
    });
    document.getElementById('choicePile').innerHTML = pile;
    document.getElementById('choiceTitle').textContent = ST.held === ST.coinSet ? 'コインが5枚たまった！' : 'コインが' + ST.held + '枚あります';
    document.getElementById('choice').hidden = false;
    smallBurstOn('choice');
    document.getElementById('exchangeBtn').focus();
  }
  function hideChoice() { document.getElementById('choice').hidden = true; }
  function exchange() {
    hideChoice();
    call('webExchange', [], function (ev) {
      V.just = null;
      showParty({ id: ev.id, kicker: 'コイン5枚と交換！', big: coinSVG('coinsvg'), reward: ev.name, art: 'sweets', after: '追加でがんばった分のご褒美。' });
    });
  }
  function eraseLast() {
    V.erasing = false; V.just = null;
    call('webErase', [V.tab]);
  }

  document.getElementById('board').addEventListener('click', function (e) {
    if (e.target.closest('[data-stamp]')) { doStamp(); return; }
    var v = e.target.closest('[data-view]');
    if (v) viewSquare(Number(v.getAttribute('data-view')));
  });
  document.getElementById('stampBtn').addEventListener('click', doStamp);
  document.getElementById('coinBtn').addEventListener('click', earnCoin);
  document.getElementById('useWrapStamp').addEventListener('click', function (e) { if (e.target.closest('[data-use]')) useCoin(); });
  document.getElementById('useWrapCoin').addEventListener('click', function (e) { if (e.target.closest('[data-use]')) useCoin(); });
  document.getElementById('partyBtn').addEventListener('click', openParty);
  document.getElementById('partyClose').addEventListener('click', closeParty);
  document.getElementById('exchangeBtn').addEventListener('click', exchange);
  document.getElementById('keepBtn').addEventListener('click', function () {
    hideChoice();
    showCheer('coin', '手持ち' + ST.held + '枚', 'ためておくね！', '交換はコインタブのご褒美からいつでもできます。', coinSVG('coinsvg'));
  });
  document.getElementById('tray').addEventListener('click', function (e) { if (e.target.closest('[data-exchange]')) showChoice(); });
  document.getElementById('cheer').addEventListener('click', hideCheer);
  document.getElementById('tabStamp').addEventListener('click', function () { V.tab = 'stamp'; V.just = null; V.erasing = false; render(); });
  document.getElementById('tabCoin').addEventListener('click', function () { V.tab = 'coin'; V.just = null; V.erasing = false; render(); });
  document.getElementById('erase').addEventListener('click', function (e) {
    var id = e.target.id;
    if (id === 'eraseAsk') { V.erasing = true; renderErase(); }
    else if (id === 'eraseNo') { V.erasing = false; renderErase(); document.getElementById('eraseAsk').focus(); }
    else if (id === 'eraseYes') eraseLast();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideCheer(); });
  // 別のアプリから戻ってきたとき（日付が変わっているかもしれない）に読み直す
  document.addEventListener('visibilitychange', function () { if (!document.hidden && ST && !V.busy) call('webState', []); });

  call('webState', []);
})();
</script>
