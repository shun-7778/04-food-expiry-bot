  return parts.join(' ・ ');
}

function daysBox(it) {
  if (it.always) return { d: '常備', u: '期限なし' };
  if (it.days === null || it.days === undefined) return { d: '—', u: '期限不明' };
  if (it.days < 0) return { d: String(-it.days), u: '日超過' };
  if (it.days === 0) return { d: '0', u: '今日まで' };
  return { d: String(it.days), u: '日残り' };
}

function mmdd(ymd) {
  var m = /^\d{4}-(\d{2})-(\d{2})$/.exec(ymd || '');
  return m ? Number(m[1]) + '/' + Number(m[2]) : (ymd || '');
}

// ---------------------------------------------------------------- 操作

/** 一覧から1件外す。シートの返事を待たずに画面を切り替えるために使う */
function takeOut(list, id) {
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === id) return list.splice(i, 1)[0];
  }
  return null;
}

/** 書き込みを1件投げる。画面はもう切り替わっている前提 */
function send(method, args) {
  pending++;
  var runner = google.script.run.withSuccessHandler(opDone).withFailureHandler(opFail);
  runner[method].apply(runner, [TOKEN].concat(args));
}

function buyShop(it) {
  // 一覧からは抜くが doneShop に控える。サーバーの返事にはもう含まれないので、
  // これが無いと済みの行がその場から消えてしまう
  takeOut(state.shop.todo, it.id);
  it.done = true;
  doneShop.push(it);
  waiting[it.id] = true;
  render();                       // 先に画面を動かす
  send('webSetShop', [it.id, true]);
}

/** toShop を立てると、使用済みにしたうえで買い物リストにも入れる */
function useStock(it, toShop) {
  stockInfo = {};   // 在庫が変わるので、レシピの「あり／なし」は開き直したときに確かめ直す
  takeOut(state.stock.items, it.id);
  it.done = true;
  it.toShop = !!toShop;
  it.shopId = '';
  doneStock.push(it);
  waiting[it.id] = true;
  render();

  if (!toShop) { send('webSetStock', [it.id, true]); return; }

  // 買い物リストに足した1件の ID を控える。取り消すとき、この操作で足した分だけを狙うため。
  // 書き込みが重なると opDone は最後の返事しか使わないので、ここは個別の受け口で拾う
  pending++;
  google.script.run
    .withSuccessHandler(function (data) {
      it.shopId = (data && data.addedShopId) || '';
      opDone(data);
    })
    .withFailureHandler(opFail)
    .webUseAndAdd(TOKEN, it.id, who);
}

/** 「戻す」。こちらも画面を先に戻してから書き込む */
function undoShop(it) {
  dropFrom(doneShop, it);
  delete it.done;
  state.shop.todo.push(it);
  waiting[it.id] = true;
  render();
  send('webSetShop', [it.id, false]);
}

/** 「レシピ」タブから消す。シートの行は残し、非表示の印を付けるだけ */
function hideRecipe(it) {
  takeOut(recipeItems(), it.id);
  it.done = true;
  doneRecipe.push(it);
  waiting[it.id] = true;
  render();
  send('webSetRecipeHidden', [it.id, true]);
}

function undoRecipe(it) {
  dropFrom(doneRecipe, it);
  delete it.done;
  recipeItems().push(it);
  waiting[it.id] = true;
  render();
  send('webSetRecipeHidden', [it.id, false]);
}

/** 料理名・カテゴリ・評価を変える（カードの長押し）。先に画面を変えてから書き込む */
function editRecipe(it) {
  openEditor({
    heading: '料理名', value: it.title || '', color: GROUP_COLOR[it.group] || '',
    groups: recipeGroups(), group: it.group || '',
    rating: it.rating || 0
  }, function (v, rating, group) {
    var patch = {};
    v = String(v || '').replace(/\s+/g, ' ').trim().substring(0, 60);
    if (v && v !== it.title) patch.title = v;   // 空にはしない
    if (group && group !== (it.group || '')) patch.group = group;
    if (rating !== (it.rating || 0)) patch.rating = rating;
    if (patch.title === undefined && patch.rating === undefined && patch.group === undefined) return;   // 変わっていなければ送らない
    if (patch.title !== undefined) it.title = patch.title;
    if (patch.rating !== undefined) it.rating = patch.rating;
    if (patch.group !== undefined) {
      it.group = patch.group;
      it.level = GROUP_COLOR[it.group] || '';   // 左の帯の色も先に変える
    }
    waiting[it.id] = true;
    render();
    send('webUpdateRecipe', [it.id, patch]);
  });
}

/** メモを書く（開いた中の「メモ」を押す）。空にして保存すると消える */
var MEMO_MAX = 1000;
function editMemo(it) {
  openEditor({
    heading: 'メモ', value: it.memo || '', multiline: true, maxLength: MEMO_MAX,
    color: GROUP_COLOR[it.group] || '',
    placeholder: '作った感想、分量の調整、次に試したいことなど'
  }, function (v) {
    v = String(v || '').replace(/\r\n?/g, '\n').trim().substring(0, MEMO_MAX);
    if (v === (it.memo || '')) return;
    it.memo = v;
    waiting[it.id] = true;
    render();
    send('webUpdateRecipe', [it.id, { memo: v }]);
  });
}

/** ピン留めの付け外し。先に画面で上へ動かしてから書き込む */
function pinRecipe(it, pinned) {
  it.pinned = pinned;
  waiting[it.id] = true;
  render();
  send('webSetRecipePinned', [it.id, pinned]);
}

/**
 * 押したカードを開く・閉じる。開いたときに、まだならその材料を在庫と突き合わせる。
 * 突き合わせの結果は stockInfo に控え、閉じて開き直しても聞き直さない
 * （在庫を動かしたとき・更新ボタンを押したときに捨てる）
 */
function toggleRecipe(it) {
  if (openRecipe[it.id]) delete openRecipe[it.id];
  else {
    openRecipe[it.id] = true;
    var st = stockInfo[it.id];
    if ((!st || st.error) && (it.ingredients || []).length) checkRecipeStock(it);
  }
  renderRecipes();
}

function checkRecipeStock(it) {
  var id = it.id;
  stockInfo[id] = { loading: true };
  google.script.run
    .withSuccessHandler(function (r) {
      var have = {};
      ((r && r.have) || []).forEach(function (n) { have[n] = true; });
      stockInfo[id] = { have: have };
      renderRecipes();
    })
    .withFailureHandler(function () {
      stockInfo[id] = { error: true };
      renderRecipes();
    })
    .webRecipeStock(TOKEN, id);
}

/**
 * レシピの材料を買い物リストに足す。先に画面の買い物リストへ仮の行を入れ、
 * 材料の印を「リスト済」にしてから書き込む（他の操作と同じく、返事を待たせない）
 */
function addRecipeItems(it, names) {
  names = names.filter(function (n) { return !inShopList(n); });
  if (!names.length) return;

  var byName = {};
  (it.ingredients || []).forEach(function (g) { byName[g.name] = g; });
  names.forEach(function (n) {
    var temp = {
      id: 'tmp' + (++tempSeq), name: n, amount: (byName[n] && byName[n].amount) || '',
      added: '', by: who, recipeId: it.id, recipe: { title: it.title, url: it.url }
    };
    state.shop.todo.push(temp);
    waiting[temp.id] = true;
  });
  render();
  send('webAddRecipeItems', [it.id, names, who]);
}

function undoStock(it) {
  stockInfo = {};
  dropFrom(doneStock, it);
  var toShop = it.toShop;
  var shopId = it.shopId;
  delete it.done;
  delete it.toShop;
  delete it.shopId;

  state.stock.items.push(it);
  waiting[it.id] = true;
  render();

  // 左になぞった分は買い物リストにも入れているので、そちらも一緒に取り消す
  if (toShop) send('webUndoUseAndAdd', [it.id, shopId || '']);
  else send('webSetStock', [it.id, false]);
}

function add() {
  var input = $('add-name');
  var name = input.value.trim();
  if (!name) return;

  input.value = '';
  input.blur();                     // 追加したらキーボードは閉じる

  // ID はシート側で採番するので、それまでは仮の1件を並べておく
  // 追加日はシート側で入るのでまだ空。名乗っている名前だけは先に出しておく
  var temp = { id: 'tmp' + (++tempSeq), name: name, added: '', by: who };
  state.shop.todo.push(temp);
  waiting[temp.id] = true;
  render();

  send('webAddShop', [name, who]);
}

/** 今のタブで文字を打つ入力欄 */
function activeInput() {
  if (!$('panel-stock').hidden) return $('stock-q');
  if (!$('panel-recipe').hidden) return $('recipe-q');
  return $('add-name');
}

/**
 * キーボードが出ているあいだだけ下のタブを引っ込める。
 * 一覧の一番下が隠れるのと、キーボードに押し上げられるのを避けるため。
 * キーボードを閉じたらタブは戻す。在庫の検索は言葉を残したまま一覧を
 * 見ることがあるので、入力欄に文字が残っていても戻す。
 * 端末の「閉じる」ボタンで閉じたときは入力欄に印が残ったままになるため、
 * blur ではなく画面の高さでキーボードの開閉を見ている
 */
var tabbarTimer = 0;
var tabbarWaitUntil = 0;   // キーボードが閉じるのを待つのは、長くてもここまで
var tabbarLastH = -1;      // 前に見た画面の高さ。動きが止まったかを見るため
var fullHeight = 0;        // キーボードが出ていないときの画面の高さ
var focusAt = 0;           // 入力欄に入った時刻。キーボードが出るまでの猶予に使う
var focusHeight = 0;       // 入力欄に入った瞬間の高さ。キーボードの開閉を測る基準
var KEYBOARD_WAIT = 1200;  // 入力欄に入ってからキーボードが出るのを待つ長さ

function updateTabbar() {
  var typing = document.activeElement === activeInput();
  // 入力欄に入った直後はまだ画面が縮んでいない。ここで一度タブを出すと
  // すぐに引っ込むことになるので、猶予のあいだは出ている扱いにする
  var opening = typing && Date.now() - focusAt < KEYBOARD_WAIT;
  var away = typing && (keyboardOpen() || opening);

  clearTimeout(tabbarTimer);
  if (away) {
    showTabbar(false);
    tabbarWaitUntil = 0;
    // 端末の「閉じる」ボタンでキーボードを閉じたときは、入力欄に印が残ったままで
    // resize も来ないことがある。隠しているあいだは自分で見張って戻す
    tabbarTimer = setTimeout(updateTabbar, 300);
    return;
  }

  // 戻すのはキーボードが閉じ切ってから。閉じている最中に出すと、
  // まだ縮んでいる画面の途中にタブが現れて、そのまま下がるのがちらつきに見える。
  // 高さがもとに戻り、そのうえで動きが止まったこと（2回続けて同じ値）まで確かめる
  if (!tabbarWaitUntil) { tabbarWaitUntil = Date.now() + 2000; tabbarLastH = -1; }
  var h = viewHeight();
  var settled = !keyboardOpen() && h === tabbarLastH;
  tabbarLastH = h;

  if (settled || Date.now() > tabbarWaitUntil) {
    showTabbar(true);
    tabbarWaitUntil = 0;
    return;
  }
  tabbarTimer = setTimeout(updateTabbar, 100);
}

/** 入力欄に入った時刻と、そのときの高さを控えてからタブを見直す */
function noteFocus() {
  focusAt = Date.now();
  // 入る瞬間はまだキーボードが出ていない。この高さを基準にすれば、
  // 端末ごとの余白や、上の帯が縮む作りの影響を受けずに開閉を見られる
  focusHeight = viewHeight();
  updateTabbar();
}

function showTabbar(on) {
  $('tabbar').className = 'tabbar' + (on ? '' : ' away');
}

/** 見えている画面の高さ。visualViewport が無ければ窓の高さで代える */
function viewHeight() {
  return window.visualViewport ? window.visualViewport.height : window.innerHeight;
}

/**
 * キーボードで画面が狭くなっているか。
 * 端末によって visualViewport だけが縮むものと窓ごと縮むものがあるので、
 * 「キーボードが無いときの高さ」から縮んだかで見る。
 * 基準は入力欄に入った瞬間の高さ。無ければ読み込み時の高さで代える
 */
function keyboardOpen() {
  var base = focusHeight || fullHeight;
  return base - viewHeight() > 120;
}

/** 文字を打っていないあいだの高さを、キーボードが無いときの高さとして覚える */
function noteFullHeight() {
  var el = document.activeElement;
  if (el === $('add-name') || el === $('stock-q') || el === $('recipe-q')) return;
  // 以前は最大値を溜めていたが、一度でも高い状態を見ると以後ずっと
  // 「キーボードが出ている」と誤られるので、そのときの高さをそのまま持つ
  fullHeight = viewHeight();
  focusHeight = 0;
}

/**
 * 上のかたまり（検索・追加欄と切り替えボタン）を、スクロールに合わせて出し入れする。
 * 下へ動かした分だけ隠れ（一覧と同じ速さ）、上へ戻した分だけ出てくる。
 * 指を止めて半端な位置で止まったら、最後に動かした向きで出し切るか隠し切る
 * （下へなら少しでも隠し切る。上へ戻している途中なら出す）。
 * 先頭と、文字を打っている間は全部出しておく。
 *
 * 動かし方：かたまりは2つの置き方を行き来する。
 *  - 出し切っているとき：画面の上に留める（fixed）
 *  - それ以外：ページの中の決まった高さ（stickyTop）に置く（absolute）。こうするとブラウザが一覧と
 *    一緒にスクロールさせるので、JS が追いかけて遅れることがない。
 *    下へ動き始めたら、その場の高さでページに置く → 一覧と一緒に上へ流れて消える。
 *    隠れ切ったあと上へ戻し始めたら、画面のすぐ上の高さに置き直す → 一覧と一緒に下りてくる。
 *    出し切ったところで画面の上に留め直す
 */
var lastScrollY = 0;
var snapTimer = 0;
var lastDir = 0;        // 最後に動かした向き（1=下へ、-1=上へ）
var STICKY_FADE = 16;   // かたまりの下に流しているぼかしの高さ（.sticky::after）

var stickyEl = document.querySelector('.sticky');
var stickySpace = $('sticky-space');
var stickyMax = 0;      // 隠し切るときの量（欄の高さ＋ぼかし）
var stickyFixed = false;
var stickyTop = 0;      // absolute のときの、ページの中での高さ
var stickyFrame = 0;

/** 欄の高さを測り直し、ページの流れから外した分の場所を空けておく */
function measureSticky() {
  var h = stickyEl.offsetHeight;
  stickySpace.style.height = h + 'px';
  stickyMax = h + STICKY_FADE;
}

function placeSticky(fixed, top) {
  stickyFixed = fixed;
  stickyTop = fixed ? 0 : top;
  stickyEl.style.position = fixed ? 'fixed' : 'absolute';
  stickyEl.style.top = stickyTop + 'px';
}

/**
 * 置き場所を付け替えた直後に、元の見た目の位置から新しい位置まで短く動かす。
 * from は「新しい位置から見て、いま見えている位置がどれだけずれているか」（px）
 */
function slideSticky(from) {
  if (!from) return;
  stickyEl.style.transition = 'none';
  stickyEl.style.transform = 'translate3d(0,' + from + 'px,0)';
  void stickyEl.offsetHeight;   // いったん描かせてから動かす
  stickyEl.style.transition = 'transform .18s ease-out';
  stickyEl.style.transform = '';
}

/** いまどれだけ隠れているか（0〜stickyMax） */
function stickyHiddenAt(y) {
  return stickyFixed ? 0 : Math.max(0, Math.min(stickyMax, y - stickyTop));
}

function updateSticky() {
  stickyFrame = 0;
  if (!stickyMax) measureSticky();
  // 端で跳ね返る動き（iPhone の上下のバウンド）を向きの変化に数えないよう、動ける範囲に収める
  var room = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
  var y = Math.min(room, Math.max(0, window.scrollY || window.pageYOffset || 0));
  var dy = y - lastScrollY;
  lastScrollY = y;
  if (dy) lastDir = dy > 0 ? 1 : -1;

  if (document.activeElement === activeInput()) {
    if (!stickyFixed) { var h0 = stickyHiddenAt(y); placeSticky(true, 0); slideSticky(-h0); }
    return;
  }

  if (y <= 0) {
    // 先頭では本来の場所（ページの一番上）に戻す。見た目の位置は fixed のときと同じ
    if (stickyFixed || stickyTop !== 0) placeSticky(false, 0);
  } else if (dy > 0) {
    // 下へ動き始めた：いま見えている位置のままページに置き、一覧と一緒に流す
    if (stickyFixed) placeSticky(false, y - dy);
  } else if (dy < 0 && !stickyFixed) {
    if (y - stickyTop > stickyMax) placeSticky(false, y - stickyMax);   // 隠れ切っている → 画面のすぐ上へ
    else if (y <= stickyTop) placeSticky(true, 0);                       // 出し切った → 上に留める
  }

  clearTimeout(snapTimer);
  snapTimer = setTimeout(function () { snapSticky(room); }, 160);
}

/** 指を止めたとき、半端な位置なら出し切るか隠し切る */
function snapSticky(room) {
  var y = lastScrollY;
  var h = stickyHiddenAt(y);
  if (h <= 0 || h >= stickyMax) return;
  if (lastDir < 0) {
    // 上へ戻して止まった → 出し切る
    placeSticky(true, 0);
    slideSticky(-h);
    return;
  }
  // 下へ少しでも動かして止まった → 隠し切る。
  // 先頭付近（欄の高さより上）では、欄だけ消すと上に空きができるので、一覧ごと欄の高さまで送る。
  // 送る間も欄は一覧と一緒に上がっていき、着いたときに隠れ切る
  if (y < stickyMax && room >= stickyMax) {
    window.scrollTo({ top: stickyMax, behavior: 'smooth' });
    return;
  }
  placeSticky(false, y - stickyMax);
  slideSticky(stickyMax - h);
}

measureSticky();
// 中身（タブの切り替え・絞り込みの描き直し）で欄の高さが変わったら、空けておく場所も合わせる
if (window.ResizeObserver) new ResizeObserver(function () { measureSticky(); }).observe(stickyEl);

// 位置の書き換えは、画面を描く直前（requestAnimationFrame）に1コマ1回だけ行う。
// scroll は1コマに何度も来ることがあり、そのたびに書き換えると動きが揃わずカクつく
window.addEventListener('scroll', function () {
  if (!stickyFrame) stickyFrame = requestAnimationFrame(updateSticky);
}, { passive: true });
window.addEventListener('resize', measureSticky);

fullHeight = viewHeight();
window.addEventListener('resize', function () { noteFullHeight(); updateTabbar(); });
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', function () {
    noteFullHeight();
    updateTabbar();
  });
}
// 画面を回すと高さそのものが変わる。覚え直さないとキーボード扱いになってしまう
window.addEventListener('orientationchange', function () {
  setTimeout(function () { fullHeight = viewHeight(); focusHeight = 0; }, 400);
});

['over', 'soon', 'ok'].forEach(function (lv) {
  $('f-' + lv).addEventListener('click', function () {
    filter = filter === lv ? '' : lv;   // もう一度押したら絞り込みを解く
    render();
  });
});

$('f-all').addEventListener('click', function () {
  filter = '';
  render();
});

$('reload').addEventListener('click', function () {
  // 枠の中で location.reload() すると白い画面になるので、中身だけ取り直す
  doneShop = [];
  doneStock = [];
  doneRecipe = [];
  stockInfo = {};   // 在庫が動いているかもしれないので、開いたレシピは照らし合わせ直す
  waiting = {};
  load();
});

var TABS = ['shop', 'stock', 'recipe'];
TABS.forEach(function (name) {
  $('tab-' + name).addEventListener('click', function () { switchTab(name); });
});

function switchTab(name) {
  TABS.forEach(function (t) {
    var on = t === name;
    $('tab-' + t).className = 'tab' + (on ? ' on' : '');
    $('head-' + t).hidden = !on;
    $('panel-' + t).hidden = !on;
  });
  showNotice('');
  updateTabbar();

  // 切り替えたら必ず先頭から見せる。前のタブで下まで見ていた位置が残っていると、
  // 一覧の途中から始まって迷ううえ、ブラウザを閉じる下スワイプも効かなくなる
  window.scrollTo(0, 0);
  // タブごとに上の欄の高さが違うので測り直し、隠していた欄は出しておく
  measureSticky();
  lastScrollY = 0;
  clearTimeout(snapTimer);
  placeSticky(false, 0);
}

// このURLに入っている呼び名。無ければ、前にこの端末で覚えた分
who = loadWho();

// 開く先のタブ。URL の ?tab=stock / ?tab=recipe で在庫・レシピから始められる（既定は買い物）
if (START_TAB === 'stock' || START_TAB === 'recipe') switchTab(START_TAB);

// 画面に戻ってきたら全体を読み直す。書き込みの返事は触った区分だけなので、
// 家族が別の区分（在庫・レシピなど）を変えた分は、ここで拾う。
// 30秒以上離れていたときだけにして、アプリを行き来するたびに読みに行かないようにする
var hiddenAt = 0;
document.addEventListener('visibilitychange', function () {
  if (document.hidden) {
    hiddenAt = Date.now();
    return;
  }
  if (TOKEN && state && pending === 0 && hiddenAt && Date.now() - hiddenAt > 30000) load();
  hiddenAt = 0;
});

// 画面と一緒に届いた最初のデータ。読めなければ null（そのときは取りに行く）
function initialData() {
  var el = $('init');
  var raw = el ? el.textContent.trim() : '';
  if (el) el.textContent = '';   // もう要らないので手放す
  if (!raw) return null;
  try { return JSON.parse(raw); } catch (e) { return null; }
}

// 埋め込みが何かの拍子に空だったときは、開いているURLの ?k= から拾い直す
var INITIAL = initialData();
if (TOKEN && INITIAL) {
  apply(INITIAL);   // 通信せずにすぐ描く
} else if (TOKEN) {
  load();
} else if (google.script.url) {
  google.script.url.getLocation(function (loc) {
    TOKEN = (loc && loc.parameter && loc.parameter.k) || '';
    load();
  });
} else {
  showNotice('リンクが正しくありません。LINEで「リンク」と送って開き直してください。');
}
</script>
</body>
</html>
